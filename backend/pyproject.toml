[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-newsletter-backend"
version = "0.1.0"
description = "AI Trend Newsletter Service Backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.17",

    # Database
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "pgvector==0.3.6",

    # Task queue
    "celery==5.4.0",
    "redis==5.2.1",
    "celery[redis]==5.4.0",

    # HTTP / Web scraping
    "httpx==0.28.1",
    "feedparser==6.0.11",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "playwright==1.49.0",

    # AI / LLM
    "openai==1.57.2",
    "tiktoken==0.8.0",

    # Email
    "aiosmtplib==3.0.2",
    "jinja2==3.1.4",

    # Data processing
    "pydantic==2.10.3",
    "pydantic[email]==2.10.3",
    "pydantic-settings==2.7.0",
    "python-dateutil==2.9.0",
    "pytz==2024.2",

    # Similarity / dedup
    "simhash==2.1.2",
    "numpy==2.2.0",

    # Utilities
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "factory-boy==3.3.1",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "aiosqlite==0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
