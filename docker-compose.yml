services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aitracker_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aitracker}
      POSTGRES_USER: ${POSTGRES_USER:-aitracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitracker_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aitracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitracker_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aitracker}:${POSTGRES_PASSWORD:-aitracker_secret}@postgres:5432/${POSTGRES_DB:-aitracker}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-aitracker}:${POSTGRES_PASSWORD:-aitracker_secret}@postgres:5432/${POSTGRES_DB:-aitracker}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitracker_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aitracker}:${POSTGRES_PASSWORD:-aitracker_secret}@postgres:5432/${POSTGRES_DB:-aitracker}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-aitracker}:${POSTGRES_PASSWORD:-aitracker_secret}@postgres:5432/${POSTGRES_DB:-aitracker}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitracker_beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aitracker}:${POSTGRES_PASSWORD:-aitracker_secret}@postgres:5432/${POSTGRES_DB:-aitracker}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-aitracker}:${POSTGRES_PASSWORD:-aitracker_secret}@postgres:5432/${POSTGRES_DB:-aitracker}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aitracker_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
